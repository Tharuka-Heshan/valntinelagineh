    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; width: 100%; font-family: 'Poppins', sans-serif; background: #ffdde1; overflow-x: hidden; }
        
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(-45deg, #ffdde1, #ee9ca7, #a2d2ff, #c2e9fb, #e2d1f9); background-size: 400% 400%; animation: softGradient 12s ease infinite alternate; }

        .ribbon-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden; }
        .ribbon { position: absolute; width: 300%; height: 3px; background: linear-gradient(90deg, transparent, #00f2ff, #ff00de, #7d00ff, transparent); box-shadow: 0 0 20px #00f2ff, 0 0 30px #ff00de; opacity: 0.4; animation: moveRibbon 10s linear infinite; }

        /* Floating Emojis Styling */

        .main-wrapper { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        /* Card Animations */
        .card, .expired { background: rgba(255, 255, 255, 0.95); padding: 35px 25px; border-radius: 40px; text-align: center; width: 100%; max-width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 1); z-index: 100; position: relative; margin: auto 0; display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .expired { color: #ff4d6d; border: 1.5px solid #ffe5ec; }
        
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .main-title { font-family: 'Dancing Script', cursive; color: #ff4d6d; font-size: 2.5rem; margin-bottom: 8px; animation: wave 2s infinite ease-in-out; }

        .step-desc { font-size: 0.85rem; color: #666; margin-bottom: 12px; }
        .custom-input { width: 100%; padding: 13px; border-radius: 18px; border: 1.5px solid #eee; outline: none; text-align: center; font-size: 16px; background: white; margin-bottom: 10px; transition: 0.3s; }
        .custom-input:focus { border-color: #ff4d6d; box-shadow: 0 0 10px rgba(255, 77, 109, 0.2); }
        
        .push-btn { border: none; border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 15px; width: 100%; padding: 15px; transform: translateY(0); }
        .push-btn:active { transform: translateY(4px); box-shadow: none !important; }
        
        .btn-blue { background: #a2d2ff; color: #5d7dbc; box-shadow: 0 6px 0 #89b8e6; }
        .btn-pink { background: #ff4d6d; color: #fff; padding: 18px 50px; min-width: 170px; box-shadow: 0 6px 0 #c23b54; width: auto; }
        .btn-no { background: #fff; color: #ff4d6d; border: 1.5px solid #ffccd5; padding: 12px 30px; border-radius: 50px; font-weight: 600; touch-action: none; position: relative; z-index: 200; transition: left 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .secret-trigger { position: absolute; bottom: 15px; right: 20px; width: 35px; height: 35px; background: #fffafb; color: #ffccd5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 1px solid #ffedf1; transition: 0.3s; }
        .secret-trigger:hover { background: #ff4d6d; color: white; }
        
        .loader-ring { border: 4px solid #f3f3f3; border-top: 4px solid #ff4d6d; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .owner-tag { position: absolute; bottom: 20px; font-size: 11px; color: #777; z-index: 100; text-align: center; width: 100%; pointer-events: none; }

        .top-contact:hover { transform: scale(1.1); }

        .rainbow-expander { position: fixed; top: 50%; left: 50%; width: 0; height: 0; transform: translate(-50%, -50%); border-radius: 50%; z-index: 10; background: conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); box-shadow: 0 0 100px rgba(255, 215, 0, 0.8); opacity: 0; transition: all 2s ease-out; pointer-events: none; }
        .rainbow-active { width: 400vmax; height: 400vmax; opacity: 0.4; border-radius: 0; animation: slowRotate 15s linear infinite; }
